<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Shopping Cart | Radiant Aura</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@200;300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/store.css">
<style>
.cart-header { padding: 160px 64px 60px; text-align: center; background: var(--ivory2); border-bottom: 1px solid rgba(184,150,12,0.1); }
.cart-header h1 { font-family: 'Cormorant Garamond', serif; font-size: 52px; color: var(--ink); margin-bottom: 10px; }

.cart-main { padding: 80px 64px; max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1.5fr 1fr; gap: 60px; }
.cart-items { display: flex; flex-direction: column; gap: 30px; }
.cart-item { display: grid; grid-template-columns: 120px 1fr auto; gap: 25px; padding-bottom: 30px; border-bottom: 1px solid rgba(184,150,12,0.1); align-items: start; }
.cart-item-img { width: 120px; aspect-ratio: 1; background: var(--ivory2); overflow: hidden; border: 1px solid rgba(184,150,12,0.05); }
.cart-item-img img { width: 100%; height: 100%; object-fit: cover; }
.cart-item-info h3 { font-family: 'Cormorant Garamond', serif; font-size: 22px; margin-bottom: 8px; color: var(--ink); }
.cart-item-price { color: var(--gold); font-weight: 500; margin-bottom: 15px; }

.cart-summary { background: var(--white); padding: 40px; border: 1px solid rgba(184,150,12,0.1); align-self: start; position: sticky; top: 120px; }
.summary-title { font-family: 'Cormorant Garamond', serif; font-size: 28px; margin-bottom: 30px; border-bottom: 1px solid rgba(184,150,12,0.1); padding-bottom: 15px; }
.summary-row { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 14px; color: var(--text2); }
.summary-total { border-top: 1px solid rgba(184,150,12,0.1); margin-top: 20px; padding-top: 20px; font-size: 20px; color: var(--ink); font-weight: 600; }

.empty-cart { text-align: center; padding: 100px 0; grid-column: span 2; }
.empty-cart h2 { font-family: 'Cormorant Garamond', serif; font-size: 36px; margin-bottom: 20px; color: var(--text2); }

/* Navigation & Footer */
nav { position: fixed; top: 0; left: 0; right: 0; z-index: 500; display: flex; align-items: center; justify-content: space-between; padding: 28px 64px; background: rgba(253,250,244,0.96); backdrop-filter: blur(20px); box-shadow: 0 1px 0 rgba(184,150,12,0.1); }
.nav-logo { font-family: 'Cormorant Garamond', serif; font-size: 24px; letter-spacing: 10px; color: var(--gold); text-decoration: none; }
.nav-logo sup { font-size: 9px; color: var(--rose); vertical-align: super; }
footer { background: var(--ink); color: rgba(255,255,255,0.6); padding: 60px 64px 30px; text-align: center; }

@media(max-width: 900px) {
  .cart-main { grid-template-columns: 1fr; padding: 60px 24px; }
  .cart-header { padding: 120px 24px 40px; }
  nav { padding: 20px 24px; }
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">RADIANT<sup>AURA</sup></a>
  <a href="shop.html" class="btn-primary" style="padding: 10px 20px; font-size: 9px;">Continue Shopping</a>
</nav>

<header class="cart-header">
    <h1>Your Bag</h1>
    <p style="font-size: 13px; letter-spacing: 1px; color: var(--text2);">REVIEW YOUR SELECTIONS BEFORE CHECKOUT</p>
</header>

<main class="cart-main" id="cartContent">
    <div class="cart-items" id="cartItemsList">
        <!-- Cart items will be injected here -->
    </div>

    <div class="cart-summary" id="cartSummarySection">
        <h2 class="summary-title">Order Summary</h2>
        <div class="summary-row">
            <span>Subtotal</span>
            <span id="subtotalVal">₹0</span>
        </div>
        <div class="summary-row">
            <span>Shipping</span>
            <span id="shippingVal">FREE</span>
        </div>
        <div class="summary-row">
            <span>Estimated Tax</span>
            <span>Included</span>
        </div>
        <div class="summary-row summary-total">
            <span>Total</span>
            <span id="totalVal">₹0</span>
        </div>
        <div style="margin-top: 30px;">
            <a href="checkout.html" class="btn-primary" style="width: 100%; border-radius: 0;">Proceed to Checkout</a>
        </div>
        <p style="font-size: 11px; text-align: center; margin-top: 20px; color: var(--text2); letter-spacing: 0.5px;">SECURE CHECKOUT GUARANTEED</p>
    </div>
</main>

<footer>
    <div class="f-logo">RADIANT AURA</div>
    <div style="font-size: 11px; opacity: 0.6;">&copy; 2026 Radiant Aura Luxury Jewellery.</div>
</footer>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script>
window.refreshCartPage = function() {
    const list = document.getElementById('cartItemsList');
    const summary = document.getElementById('cartSummarySection');
    const content = document.getElementById('cartContent');
    const cart = CartSystem.cart;

    if (cart.length === 0) {
        content.innerHTML = `
            <div class="empty-cart">
                <h2>Your bag is empty</h2>
                <p style="margin-bottom: 30px; color: var(--text);">Looks like you haven't added anything yet.</p>
                <a href="shop.html" class="btn-primary">Browse Collection</a>
            </div>
        `;
        return;
    }

    list.innerHTML = cart.map(item => `
        <div class="cart-item">
            <div class="cart-item-img"><img src="images/${item.image}" alt="${item.name}"></div>
            <div class="cart-item-info">
                <h3>${item.name}</h3>
                <div class="cart-item-price">₹${item.price}</div>
                <div class="qty-selector">
                    <div class="qty-btn" onclick="CartSystem.updateQuantity('${item.id}', -1)">-</div>
                    <div class="qty-val">${item.quantity}</div>
                    <div class="qty-btn" onclick="CartSystem.updateQuantity('${item.id}', 1)">+</div>
                </div>
            </div>
            <div style="text-align: right;">
                <div style="font-weight: 600; color: var(--ink); margin-bottom: 15px;">₹${item.price * item.quantity}</div>
                <button onclick="CartSystem.removeFromCart('${item.id}')" style="background: none; border: none; color: #e74c3c; font-size: 11px; cursor: pointer; letter-spacing: 1px; text-transform: uppercase;">Remove</button>
            </div>
        </div>
    `).join('');

    const subtotal = CartSystem.getCartTotal();
    document.getElementById('subtotalVal').innerText = `₹${subtotal}`;
    document.getElementById('totalVal').innerText = `₹${subtotal}`;
    
    // Shipping logic (e.g. free above 599)
    if (subtotal < 599 && subtotal > 0) {
        document.getElementById('shippingVal').innerText = `₹60`;
        document.getElementById('totalVal').innerText = `₹${subtotal + 60}`;
    } else {
        document.getElementById('shippingVal').innerText = `FREE`;
    }
};

window.addEventListener('load', () => {
    // CartSystem handles initial load
    window.refreshCartPage();
});
</script>
</body>
</html>
